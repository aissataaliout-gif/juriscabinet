{% extends "layouts/dashboard.html" %}

{% block title %}Mon profil{% endblock %}

{% block dashboard_content %}

<h2 class="mb-4">Mon profil</h2>

<div class="card border-0 shadow-sm" style="max-width: 500px;">
    <div class="card-body">

        <div class="text-center mb-4">
            {% if request.user.profile_picture %}
                <img src="{{ request.user.profile_picture.url }}"
                     style="width: 100px; height: 100px; border-radius: 50%; object-fit: cover;">
            {% else %}
                <div style="width: 100px; height: 100px; border-radius: 50%; background: #0B3A5B;
                            color: white; display: flex; align-items: center; justify-content: center;
                            font-size: 2rem; font-weight: 700; margin: 0 auto;">
                    {{ request.user.username|first|upper }}
                </div>
            {% endif %}
        </div>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Photo de profil</label>
                <input type="file" name="profile_picture" class="form-control" accept="image/*">
            </div>

            <div class="mb-3">
                <label class="form-label">Téléphone</label>
                <input type="text" name="phone" class="form-control" value="{{ request.user.phone }}">
            </div>

            <button type="submit" class="btn btn-primary w-100">Enregistrer</button>
        </form>

    </div>
</div>

{% endblock %}
