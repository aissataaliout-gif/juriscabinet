{% extends 'base.html' %}

{% block title %}Connexion{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card shadow">

                <div class="card-body">

                    <h2 class="text-center mb-4">
                        JurisCabinet
                    </h2>

                    <p class="text-center text-muted">
                        Connexion
                    </p>

                    {% if error %}
                    <div class="alert alert-danger">
                         {{ error }}
                    </div>
                    {% endif %}
                    
                    <form method="POST">

                        {% csrf_token %}

                        <div class="mb-3">

                            <label>Nom d'utilisateur</label>

                            <input
                                type="text"
                                class="form-control"
                                name="username"
                            >

                        </div>

                        <div class="mb-3">

                            <label>Mot de passe</label>

                            <input
                                type="password"
                                class="form-control"
                                name="password"
                            >

                        </div>

                        <button
                            class="btn btn-primary w-100"
                            type="submit">

                            Se connecter

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
