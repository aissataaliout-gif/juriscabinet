{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <div class="text-center mb-5">
        <h2>Bienvenue Maître {{ request.user.first_name }} 👋</h2>
        <p class="text-muted">
            Espace Avocat JurisCabinet
        </p>
    </div>

    <div class="row g-4">

        <div class="col-md-3">
            <div class="card shadow border-0">
                <div class="card-body text-center">
                    <h5>👥 Clients</h5>
                    <a href="{% url 'client_list' %}" class="btn btn-primary mt-3">
                        Ouvrir
                    </a>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow border-0">
                <div class="card-body text-center">
                    <h5>📁 Dossiers</h5>
                    <a href="{% url 'dossier_list' %}" class="btn btn-primary mt-3">
                        Ouvrir
                    </a>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow border-0">
                <div class="card-body text-center">
                    <h5>📄 Documents</h5>
                    <a href="{% url 'document_list' %}" class="btn btn-primary mt-3">
                        Ouvrir
                    </a>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow border-0">
                <div class="card-body text-center">
                    <h5>💰 Factures</h5>
                    <a href="{% url 'invoice_list' %}" class="btn btn-primary mt-3">
                        Ouvrir
                    </a>
                </div>
            </div>
        </div>

    </div>

</div>
{% endblock %}
