{% extends "layouts/dashboard.html" %}

{% block content %}

<div class="container mt-4">

    <h2>Supprimer un avocat</h2>

    <p>
        Êtes-vous sûr de vouloir supprimer l'avocat
        <strong>{{ lawyer.first_name }} {{ lawyer.last_name }}</strong> ?
    </p>

    <form method="post">
        {% csrf_token %}

        <button type="submit" class="btn btn-danger">
            🗑️ Oui, supprimer
        </button>

        <a href="{% url 'lawyer_list' %}" class="btn btn-secondary">
            Annuler
        </a>
    </form>

</div>

{% endblock %}
